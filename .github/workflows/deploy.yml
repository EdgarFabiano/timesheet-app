name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: ["master"]

env:
  REGISTRY_NAME: 'acrtimetrackeracr'
  RESOURCE_GROUP: 'timetracker'
  LOCATION: 'eastus'
  BACKEND_APP: 'timetracker-api'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend-sha: ${{ steps.meta-backend.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        id: meta-backend
        with:
          context: ./backend/TimesheetApp.API
          push: true
          tags: |
            ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.BACKEND_APP }}:${{ github.sha }}
            ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.BACKEND_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Backend to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appName: ${{ env.BACKEND_APP }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerImage: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.BACKEND_APP }}:${{ needs.build-and-push.outputs.backend-sha }}
          targetPort: 5282
          envvars: |
            ASPNETCORE_ENVIRONMENT=Production
            ConnectionStrings__DefaultConnection=${{ secrets.CONNECTION_STRING }}
            Jwt__Key=${{ secrets.JWT_KEY }}
